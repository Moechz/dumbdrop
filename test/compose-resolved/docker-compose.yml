# ===========================================================================
# DumbDrop for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : dumbwareio/dumbdrop:sha-ff8f813f493e89c7da056e7a3101ce2ef48e3960
#                  (Docker Hub, official multi-arch image, used unmodified)
#                  -> https://github.com/DumbWareio/DumbDrop
#                  OCI index sha256:8a377413d4e041410ec734deb1ad085caa3adfeebeab0f6f342272d234b86e52
#                  linux/amd64 sha256:9b4584d1cc4ee456aabd7271428f422dd349d9cc89e923ca42d22732e1cc93ad
#                  linux/arm64 sha256:43b9a29dda1f92fb6b5a92894acb158bb9250186720b872f873215ee204e7d88
#
# Ports   : host 8162 -> container 3000. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/dumbdropdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the image runs as root by default; the entrypoint below runs as
#           uid 1000, prepares /data/uploads and a writable HOME, and then
#           starts the unmodified application from the image tree.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  dumbdropdocker:
    image: dumbwareio/dumbdrop:sha-ff8f813f493e89c7da056e7a3101ce2ef48e3960
    container_name: dumbdropdocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        # ===========================================================================
        # TOS wrapper for DumbDrop - start-up preparation only.
        # ===========================================================================
        # The upstream image is used unmodified. Its application tree (/usr/src/app,
        # including node_modules) already exists and is owned by uid 1000, so nothing
        # is copied onto the data volume. The previous wrapper copied the whole image
        # tree to /data/app on first start (~355 MB); that copy is gone - it wasted
        # space, slowed the first start and contributed to the aarch64 install test
        # timing out.
        #
        # DumbDrop only needs writable paths on the persistent volume:
        #   /data/uploads   uploaded files and the .metadata/ upload-session folder
        #   /data           HOME for node/npm and for optional Apprise state
        # ===========================================================================
        set -u
        set -e

        mkdir -p /data/uploads
        export HOME=/data
        export UPLOAD_DIR=/data/uploads

        exec node src/server.js
    ports:
      - "8162:3000"
    environment:
      TZ: "Asia/Shanghai"
      HOME: "/data"
      UPLOAD_DIR: "/data/uploads"
    volumes:
      - /Volume1/DockerAppData/dumbdropdocker/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8162
    protocol: http
